name: Build Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # macOS
          - goos: darwin
            goarch: arm64
            platform: macOS-arm64
          # Linux
          - goos: linux
            goarch: amd64
            platform: linux-x64
          # Windows
          - goos: windows
            goarch: amd64
            platform: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          NAME="anchor"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            NAME="anchor.exe"
          fi
          mkdir -p dist
          go build -v -ldflags="-s -w" -o "dist/${NAME}"

      - name: Package binary
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp dist/anchor.exe "anchor-${{ matrix.platform }}.exe"
          else
            tar -czf "anchor-${{ matrix.platform }}.tar.gz" -C dist anchor
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchor-${{ matrix.platform }}
          path: anchor-${{ matrix.platform }}.*

  release:
    name: Publish nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes "Automated build from ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)). Unsigned pre-release." \
            dist/*
